version: "3.8"

services:
  neo4j:
    image: neo4j:5.15-enterprise
    container_name: ckg-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_default_password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "7474:7474"  
      - "7687:7687" 
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_default_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckg-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ckg-api
    environment:
      - ENVIRONMENT=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_default_password
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - repos:/workspace/repos
    networks:
      - ckg-network

volumes:
  neo4j_data:
  neo4j_logs:
  repos:

networks:
  ckg-network:
    driver: bridge
