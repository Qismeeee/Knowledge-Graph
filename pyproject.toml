[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-knowledge-graph"
version = "0.1.0"
description = "Deterministic code indexing and cross-service knowledge graph"
authors = [{name = "Dev Team"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "neo4j==5.15.0",
    "gitpython==3.1.40",
    "tree-sitter==0.20.4",
    "tree-sitter-python==0.20.4",
    "tree-sitter-javascript==0.21.2",
    "tree-sitter-typescript==0.21.0",
    "litellm==1.32.2",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "requests==2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.11",
    "mypy==1.7.1",
    "ipython==8.18.1",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=html --cov-report=term"
asyncio_mode = "auto"
